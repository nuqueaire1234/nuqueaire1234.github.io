<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B2E4F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script>window.MPP_PWA = true;</script>
<title>ProPilot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Concept : console de passerelle. Fond nuit (préserve la vision nocturne), gros boutons,
   lectures chiffrées façon instrument, feux de navigation pour le ton des notes
   (rouge = négatif, vert = positif, ambre = conseil). Mode jour disponible. */
/* Thèmes v0.14 : nuit = noir OLED + rouge (vision de nuit) ; jour = marin, blanc ou vert.
   « Automatique » suit le mode du téléphone. */
:root{
  --font-display:"Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"Roboto Mono",monospace;
  --bg:#E8F1F8; --bg2:#F7FAFC; --bar:#0B2E4F; --bar-fg:#FFFFFF; --bar-muted:#9DB7CE; --bar-line:#1D4569; --bar-accent:#7FD3FF;
  --surface:#FFFFFF; --surface-2:#E1ECF4; --line:#C3D5E3; --fg:#0B1D2C; --muted:#4A6375;
  --accent:#0A6C9F; --accent-ink:#FFFFFF; --accent-bg:#DCEEF8;
  --pos:#12804D; --pos-bg:#DCF2E7; --neg:#C32E2E; --neg-bg:#FBE2E2; --warn:#955F00; --warn-bg:#FBEED0;
  --shadow:rgba(12,29,41,.18); color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme]){
    --bg:#000; --bg2:#000; --bar:#000; --bar-fg:#FF3B2F; --bar-muted:#9E2A20; --bar-line:#3A0C08; --bar-accent:#FF3B2F;
    --surface:#080000; --surface-2:#140302; --line:#3A0C08; --fg:#FF3B2F; --muted:#A8352A;
    --accent:#FF2D1F; --accent-ink:#000; --accent-bg:rgba(255,45,31,.12);
    --pos:#E0522F; --pos-bg:rgba(224,82,47,.12); --neg:#FF1A1A; --neg-bg:rgba(255,26,26,.18); --warn:#FF7A3D; --warn-bg:rgba(255,122,61,.12);
    --shadow:rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="nuit"],:root[data-theme="dark"]{
  --bg:#000; --bg2:#000; --bar:#000; --bar-fg:#FF3B2F; --bar-muted:#9E2A20; --bar-line:#3A0C08; --bar-accent:#FF3B2F;
  --surface:#080000; --surface-2:#140302; --line:#3A0C08; --fg:#FF3B2F; --muted:#A8352A;
  --accent:#FF2D1F; --accent-ink:#000; --accent-bg:rgba(255,45,31,.12);
  --pos:#E0522F; --pos-bg:rgba(224,82,47,.12); --neg:#FF1A1A; --neg-bg:rgba(255,26,26,.18); --warn:#FF7A3D; --warn-bg:rgba(255,122,61,.12);
  --shadow:rgba(0,0,0,.6); color-scheme:dark;
}
:root[data-theme="blanc"]{
  --bg:#F4F6F8; --bg2:#FFFFFF; --bar:#FFFFFF; --bar-fg:#0C1D29; --bar-muted:#5C7282; --bar-line:#D5DEE5; --bar-accent:#1F4E79;
  --surface:#FFFFFF; --surface-2:#EAF0F4; --line:#D2DCE3; --fg:#0C1D29; --muted:#4C6474;
  --accent:#1F4E79; --accent-ink:#FFFFFF; --accent-bg:#E1EBF4;
  --pos:#12804D; --pos-bg:#DCF2E7; --neg:#C32E2E; --neg-bg:#FBE2E2; --warn:#955F00; --warn-bg:#FBEED0;
  --shadow:rgba(12,29,41,.14); color-scheme:light;
}
:root[data-theme="vert"]{
  --bg:#E4F2EE; --bg2:#F5FAF8; --bar:#0E4D45; --bar-fg:#FFFFFF; --bar-muted:#9CCBC2; --bar-line:#1F6A60; --bar-accent:#8FF0D8;
  --surface:#FFFFFF; --surface-2:#DDEEE9; --line:#BFDAD2; --fg:#0D2621; --muted:#466A62;
  --accent:#0F7B6C; --accent-ink:#FFFFFF; --accent-bg:#D6F0E9;
  --pos:#12804D; --pos-bg:#DCF2E7; --neg:#C32E2E; --neg-bg:#FBE2E2; --warn:#955F00; --warn-bg:#FBEED0;
  --shadow:rgba(13,38,33,.16); color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg) linear-gradient(180deg,var(--bg),var(--bg2)) fixed;color:var(--fg);font:400 17px/1.45 var(--font-body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.seg-opt input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.ico{width:24px;height:24px;flex:none}
.ico.sm{width:18px;height:18px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Barre du haut */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:var(--bar-fg);border-bottom:1px solid var(--bar-line)}
.bar{display:flex;align-items:center;gap:6px;min-height:46px;padding-block:2px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#clock{flex:none;font:800 23px/1 var(--font-mono);font-variant-numeric:tabular-nums;color:var(--bar-fg)}
#cnt{font:600 16px/1 var(--font-mono);color:var(--bar-fg);white-space:nowrap}
.bar h1{flex:1;min-width:0;margin:0;font:700 21px/1.1 var(--font-display);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar h1 .brand{color:var(--bar-accent)}
.bar .icon-btn{color:var(--bar-fg)}
.icon-btn{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:12px;border:0;background:transparent;color:var(--fg)}
.icon-btn.sm{width:38px;height:38px;margin-left:auto;color:var(--muted)}
#btnBack{margin-left:-10px}
.bar-act{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--bar-line);background:rgba(127,127,127,.16);color:var(--bar-fg);font-weight:600;font-size:16px}

/* Contenu */
main{max-width:720px;margin:0 auto;padding-block:16px calc(104px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px;align-content:start}
.h2{display:flex;align-items:baseline;gap:8px;margin:14px 0 0;font:700 20px/1.2 var(--font-display);letter-spacing:.05em;text-transform:uppercase;text-wrap:balance}
.h2 .cnt{font:500 15px var(--font-mono);color:var(--muted);letter-spacing:0}
.sub{color:var(--muted);font-size:15px}
.stack{display:grid;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
.empty{margin:0;padding:18px 16px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);text-align:center;font-size:16px}
.disclaimer{margin:10px 0 0;color:var(--muted);font-size:13px;line-height:1.5}
.info{margin:0;padding:12px 14px;border-radius:12px;background:var(--accent-bg);font-size:15px}
.ok-t{color:var(--pos);font-weight:600}
.warn-t{color:var(--warn);font-weight:600}

/* Lectures façon instrument */
.readouts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.readout{display:grid;gap:4px;align-content:start;padding:12px 14px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:left;min-width:0}
.readout .k{font:600 12px var(--font-body);letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.readout .v{font:500 42px/1 var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.readout .v.sm{font-size:24px;line-height:1.15}
.readout .s{font-size:13px;color:var(--muted)}
.readout.accent{border-color:var(--accent);background:var(--accent-bg)}
.readout.big .v{font-size:56px}

/* Accueil */
.searchbtn{display:flex;align-items:center;gap:10px;width:100%;min-height:54px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:16px;text-align:left}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:12px;min-height:110px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);text-align:left;font:700 22px/1.05 var(--font-display);letter-spacing:.01em}
.tile .ico{width:34px;height:34px;color:var(--accent)}
.tile small{display:block;margin-top:5px;font:500 13px/1.3 var(--font-body);letter-spacing:0;color:var(--muted)}
.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:flex-start;gap:14px;min-height:84px;background:var(--accent);border-color:transparent;color:var(--accent-ink);font-size:26px}
.tile.wide .ico{color:var(--accent-ink);width:38px;height:38px}
.tile.wide small{color:var(--accent-ink);opacity:.8}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-weight:600;font-size:17px;text-align:center}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.btn.danger{background:transparent;border-color:var(--neg);color:var(--neg)}
.btn.danger-fill{background:var(--neg);border-color:transparent;color:var(--bg)}
.btn.block{width:100%}
.btn.tall{min-height:64px;font-size:19px}
.toolbar{display:flex;gap:10px}
.toolbar input{flex:1;min-width:0}
.scroller{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.scroller .btn{flex:none;min-height:44px;padding:0 14px;font-size:15px}

/* Listes */
.li{display:flex;align-items:center;gap:12px;width:100%;min-height:66px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:left}
.li>.ico{color:var(--accent)}
.li-main{display:grid;gap:2px;min-width:0;flex:1}
.li .t{font-weight:600;font-size:18px;overflow-wrap:anywhere}
.li .s{font-size:14px;color:var(--muted)}
.li-side{display:flex;align-items:center;gap:8px;flex:none}
.li .n{font:500 14px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.dotc{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 6px;border-radius:999px;font:700 13px var(--font-mono)}
.dotc.t-neg{background:var(--neg-bg);color:var(--neg)}

/* Fiches techniques */
.specs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--line)}
.spec{display:grid;gap:2px;padding:10px 12px;background:var(--surface);min-width:0}
.spec.full{grid-column:1/-1}
.spec .k{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.spec .v{font:500 18px/1.3 var(--font-mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.spec .v.txt{font:500 17px/1.4 var(--font-body);white-space:pre-wrap}
.spec .v.none{color:var(--muted)}

/* Notes et manœuvres */
.item{display:grid;gap:8px;padding:10px 12px 12px 14px;border-radius:14px;border:1px solid var(--line);border-left:5px solid var(--line);background:var(--surface);min-width:0}
.item.t-neg{border-left-color:var(--neg)}
.item.t-pos{border-left-color:var(--pos)}
.item.t-conseil{border-left-color:var(--warn)}
.item.t-man{border-left-color:var(--accent)}
.item-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted);min-height:38px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font:700 12px var(--font-body);letter-spacing:.08em;text-transform:uppercase}
.tag::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 6px currentColor}
.tag.t-neg{color:var(--neg);background:var(--neg-bg)}
.tag.t-pos{color:var(--pos);background:var(--pos-bg)}
.tag.t-conseil{color:var(--warn);background:var(--warn-bg)}
.tag.t-info{color:var(--muted);background:var(--surface-2)}
.tag.t-man{color:var(--accent);background:var(--accent-bg)}
.item-text{white-space:pre-wrap;overflow-wrap:anywhere;font-size:17px}
.facts{display:flex;flex-wrap:wrap;gap:4px 14px;font:500 14px var(--font-mono);color:var(--muted)}
.pn{display:grid;grid-template-columns:20px 1fr;gap:6px;white-space:pre-wrap;overflow-wrap:anywhere}
.pn .s{font-weight:700;font-size:18px;line-height:1.3}
.pn.pos .s{color:var(--pos)}
.pn.neg .s{color:var(--neg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;border:0;background:var(--surface-2);font-size:14px;font-weight:600}
.chip.static{cursor:default}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.fchip{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:14px;font-weight:600}
.fchip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:transparent}

/* Briefing */
.brief{display:grid;gap:10px}
.brief-h{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border-radius:14px;border:0;background:var(--surface-2);text-align:left}
.brief-h .lbl{font:600 12px var(--font-body);letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.brief-h .t{flex:1;min-width:0;font:700 22px/1.1 var(--font-display);overflow-wrap:anywhere}
.brief-sum{display:flex;flex-wrap:wrap;gap:8px}

/* Formulaires */
.form{display:grid;gap:18px}
.field{display:grid;gap:6px;min-width:0;margin:0;padding:0;border:0}
.lbl{font:600 13px var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.req{color:var(--accent);font-style:normal}
.hint{font-size:13px;color:var(--muted)}
input,select,textarea{width:100%;min-height:54px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:400 18px var(--font-body)}
textarea{min-height:120px;resize:vertical;line-height:1.45}
.field.pos textarea{border-color:var(--pos)}
.field.neg textarea{border-color:var(--neg)}
.field.pos .lbl{color:var(--pos)}
.field.neg .lbl{color:var(--neg)}
.with-unit{position:relative;display:block}
.with-unit input{padding-right:44px;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.with-unit>span{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font:500 16px var(--font-mono)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.grid2>.field,.grid2>div{min-width:0}
.grid2 input[type=date]{width:100%;min-width:0;padding-left:8px;padding-right:4px;font-size:15px}
.grid2 .seg{flex-wrap:nowrap}
.grid2 .seg-opt{min-width:0}
.grid2 .seg-opt span{padding:0 6px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg-opt{position:relative;flex:1 1 auto}
.seg-opt input{position:absolute;inset:0;width:100%;height:100%;min-height:0;margin:0;opacity:0}
.seg-opt span{display:flex;align-items:center;justify-content:center;min-height:50px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:16px;white-space:nowrap}
.seg-opt input:checked+span{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.seg-opt.t-neg input:checked+span{background:var(--neg-bg);border-color:var(--neg);color:var(--neg)}
.seg-opt.t-pos input:checked+span{background:var(--pos-bg);border-color:var(--pos);color:var(--pos)}
.seg-opt.t-conseil input:checked+span{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.seg-opt.t-info input:checked+span{background:var(--surface-2);border-color:var(--fg);color:var(--fg)}
.pick{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:54px;padding:0 12px 0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;font-size:18px}
.pick.empty .pv{color:var(--muted)}
.pick .ico{color:var(--muted)}
.confirm{display:grid;gap:10px;padding:14px;border-radius:14px;border:1px solid var(--neg);background:var(--neg-bg)}
.confirm.calm{border-color:var(--accent);background:var(--accent-bg)}
.confirm p{margin:0;font-weight:600}

/* Barre d'onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bar);border-top:1px solid var(--bar-line)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;min-height:64px;padding:5px 0 6px;border:0;background:none;color:var(--bar-muted);font-size:12px;font-weight:600;letter-spacing:.02em}
.tab .ico{width:25px;height:25px}
.tab[aria-current="page"]{color:var(--bar-accent)}
.tab-home[aria-current="page"] .dot{outline:2px solid var(--bar-accent);outline-offset:1px}
.tab-home .dot{display:grid;place-items:center;width:36px;height:36px;margin:0;border-radius:50%;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 16px var(--shadow)}
.tab-home .dot .ico{width:22px;height:22px}

/* Sélecteur plein écran */
#sheet{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:var(--bg);padding-top:env(safe-area-inset-top,0px)}
.sheet-bar{display:flex;align-items:center;gap:6px;min-height:62px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bar);border-bottom:1px solid var(--line)}
.sheet-bar h2{margin:0;font:700 23px var(--font-display);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-body{flex:1;overflow-y:auto;display:grid;gap:12px;align-content:start;padding-block:14px calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.create{display:grid;gap:8px}

#toast{position:fixed;z-index:60;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(86px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;padding:14px 16px;border-radius:14px;background:var(--fg);color:var(--bg);font-weight:600;font-size:16px;box-shadow:0 8px 24px var(--shadow)}
@media (prefers-reduced-motion: no-preference){
  #toast{animation:up .18s ease-out}
  @keyframes up{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
}
@media (min-width:600px){.tiles{grid-template-columns:repeat(3,1fr)}}
/* v0.13 : fiche navire, DSQ, mouillages, bottin */
.sec{margin:22px 0 2px;padding-top:12px;border-top:1px solid var(--line);font:700 19px/1.2 var(--font-display);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.form .sec:first-child{margin-top:0;border-top:0;padding-top:0}
.timef{display:grid;grid-template-columns:1fr auto;gap:8px}
.timef input{font:500 22px var(--font-mono);letter-spacing:.06em}
.timef .btn{min-height:40px;padding:0 10px;font-size:14px;align-self:center}
.powf{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px}
.powf .btn{min-width:50px;padding:0 8px}
#f_meteo{min-height:120px}
.chk{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-weight:600}
.chk input{width:24px;height:24px;accent-color:var(--accent)}

function guessSens(a) {
  const rd = regionOf(depLieu(a)), rv = regionOf(destLieu(a));
  if (deLambert(a) || rd === 'Montréal' || rd === 'Voie maritime') return 'descendant';
  if (versLambert(a) || rv === 'Montréal' || rv === 'Voie maritime' || rd === 'Trois-Rivières') return 'montant';
  return 'montant';
}
function etaTable(a) {
  const sens = a.sens || guessSens(a), up = sens === 'montant';
  const codes = POINTS.map(p => p[0]).filter(c => c !== 'CIP2' && c !== 'ECL');
  if ((up && versLambert(a)) || (!up && deLambert(a))) codes.push('CIP2', 'ECL');
  if (!up) codes.reverse();
  const vDef = a.vitesse || (up ? 10 : 14), pas = a.passages || {};
  let cur = tMin(pas[codes[0]] || a.hDepart);
  const rows = codes.map((c, i) => {
    let dist = null, k = null, v = null;
    if (i > 0) { k = segKey(codes[i - 1], c); dist = SEG[k]; v = (a.vSeg && a.vSeg[k]) || vDef; if (cur != null) cur += dist / v * 60; }
    if (pas[c]) cur = tMin(pas[c]);
    return {c, nom:ptName(c), dist, k, v, eta:cur, reel:pas[c] || '', doute:SEG_DOUTE.includes(k)};
  });
  return {sens, vDef, rows};
}
const etaDe = (a, c) => { const r = etaTable(a).rows.find(x => x.c === c); return r && r.eta != null ? tFmt(r.eta) : ''; };
function startAff(id) {

}
function finishAff(id, btn) {

}

function degagRows(ta, nivOf, liste = DEGAG) {

    return `<div class="verdict ${cls}"><span>${ic} ${esc(d.nom)} : marge ${fmtNum(m)} m${bad ? ' (moins de ' + MARGE_MIN + ' m)' : ''}<small>Hauteur libre ${fmtNum(d.hl)} m${refTxt}${d.gl != null ? ` (verglas ${fmtNum(d.gl)} m : marge ${fmtNum(mg)} m)` : ''}${nivTxt} · tirant d'air ${fmtNum(ta)} m${d.rem ? ' · ' + esc(d.rem) : ''} · ${ATL}, p. ${d.p}</small></span></div>`;

const PH = {
  db: null,
  open() { return this.db ? Promise.resolve(this.db) : new Promise((ok, ko) => { try { const r = indexedDB.open('propilot-photos', 1); r.onupgradeneeded = () => r.result.createObjectStore('p', {keyPath:'id'}); r.onsuccess = () => ok(this.db = r.result); r.onerror = () => ko(r.error); } catch (e) { ko(e); } }); },
  tx(mode, fn) { return this.open().then(db => new Promise((ok, ko) => { const t = db.transaction('p', mode), q = fn(t.objectStore('p')); t.oncomplete = () => ok(q && q.result); t.onerror = () => ko(t.error); })); },
  add(o) { return this.tx('readwrite', s => s.put(o)); },
  del(id) { return this.tx('readwrite', s => s.delete(id)); },
  list(navireId) { return this.tx('readonly', s => s.getAll()).then(all => (all || []).filter(x => x.navireId === navireId).sort((x, y) => (y.date || '').localeCompare(x.date || ''))); }
};
function shrink(file) {
  return new Promise((ok, ko) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u); ok(c.toDataURL('image/jpeg', 0.75)); };
    img.onerror = () => { URL.revokeObjectURL(u); ko(new Error('image')); };
    img.src = u;
  });
}

  r.querySelector('#phIn').onchange = e => {

    shrink(f).then(src => PH.add({id:uid(), navireId, src, date:nowLocal()})).then(() => { toast('Photo enregistrée'); draw(); })

}

        <label class="field"><span class="lbl">TE arrière</span><span class="with-unit"><input id="dT" type="text" inputmode="decimal" value="${esc(t)}"><span>m</span></span></label></div>

          const ta = r2(H - T);

  navireEdit({id}) {

      mount: r => mountForm(r, NAVIRE_F, {
        delMsg:'Supprimer ce navire ? Les notes et affectations liées sont conservées.',
        onSubmit: o => {
          const dup = DB.list('navires').find(x => x.id !== id && norm(x.nom) === norm(o.nom));

  /* Quais, ancrages, remorqueurs, lieux */
  lieux({cat = 'quai', reg = '', te = '', tk = '0'}) {
    const isQ = cat === 'quai', isA = cat === 'ancrage';
    let list = DB.list('lieux').filter(l => l.cat === cat).sort(byName);
    if (isQ && reg) list = list.filter(l => regionOf(l) === reg);
    const li = l => {
      const al = itemsFor({lieuId:l.id}).filter(x => prio(x) <= 1).length, nb = itemsFor({lieuId:l.id}).length;
      const side = isA ? (l.profondeur != null ? `<span class="depth">${fmtNum(l.profondeur)} m</span>` : '<span class="depth none">prof. ?</span>') + `<span class="mk" data-prof="${l.profondeur ?? ''}"></span>` : `<span class="n">${pl(nb, 'note', 'notes')}</span>`;
      const sub = isA ? [/urgence/i.test(l.nom + ' ' + (l.notes || '')) ? 'URGENCE' : '', l.duree, l.restrictions].filter(Boolean).join(' · ') : (isQ ? [regionOf(l), l.profondeur != null ? fmtM(l.profondeur) : ''].filter(Boolean).join(' · ') : (l.secteur || CAT[l.cat]));
      return `<button class="li" data-go="lieu" data-id="${l.id}" data-name="${esc(norm(l.nom + ' ' + (l.secteur || '')))}">${ic(CAT_IC[l.cat])}<span class="li-main"><span class="t">${esc(l.nom)}</span><span class="s">${esc(sub)}</span></span>
        <span class="li-side">${al ? `<span class="dotc t-neg">${al}</span>` : ''}${side}</span></button>`;
    };
    const body = isA
      ? MGROUPES.map(g => { const it = list.filter(l => groupeMouillage(l) === g); return it.length ? `<h3 class="grp" data-grp>${esc(g)} <span class="cnt">${it.length}</span></h3>${it.map(li).join('')}` : ''; }).join('')
      : list.map(li).join('');
    return {title:CAT_PL[cat], action:{label:'Nouveau', icon:'plus', fn:() => go('lieuEdit', {cat})}, html:`
      <div class="scroller">${Object.keys(CAT).map(c => `<button class="btn ${c === cat ? 'primary' : ''}" data-go="lieux" data-cat="${c}" data-replace="1">${esc(CAT_PL[c])}</button>`).join('')}</div>
      ${isQ ? `<div class="filters" role="group" aria-label="Secteur">${['', ...REGIONS].map(r => `<button class="fchip" data-go="lieux" data-cat="quai" data-reg="${esc(r)}" data-replace="1" aria-pressed="${r === reg}">${esc(r || 'Tous')}</button>`).join('')}</div>` : ''}
      ${isA ? `<div class="dsqbox"><b>DSQ au mouillage : pétrolier 10 % du TE max · autres navires 0,90 m</b>
        <div class="grid2"><span class="with-unit"><input id="aTe" type="text" inputmode="decimal" placeholder="TE max" value="${esc(te)}" aria-label="Tirant d'eau maximal"><span>m</span></span>
        <div class="seg">${[['0', 'Autre'], ['1', 'Pétrolier']].map(([v, l]) => `<label class="seg-opt"><input type="radio" name="atk" value="${v}"${tk === v ? ' checked' : ''}><span>${l}</span></label>`).join('')}</div></div>
        <span class="sub" id="aNeed">Entrez le TE pour voir les mouillages permis.</span><span class="hint">${esc(DSQ_MOU_SRC)} · profondeurs au zéro des cartes</span></div>` : ''}
      <input id="q" type="search" placeholder="Filtrer" aria-label="Filtrer la liste" autocomplete="off">
      <div class="stack" id="lst">${body || `<p class="empty">Aucune fiche. Touchez « Nouveau ».</p>`}</div>`,
      mount: r => {
        r.querySelector('#q').oninput = e => { const Q = norm(e.target.value); r.querySelectorAll('#lst .li').forEach(b => b.hidden = !b.dataset.name.includes(Q)); };
        if (!isA) return;
        const upd = () => {
          const t = parseNum(r.querySelector('#aTe').value), k = r.querySelector('input[name="atk"]:checked')?.value || '0';
          stack[stack.length - 1].params = {cat, te:r.querySelector('#aTe').value, tk:k};
          const ok = t != null && !Number.isNaN(t), need = ok ? profRequise(t, k === '1') : null;
          r.querySelector('#aNeed').innerHTML = ok ? `Profondeur requise : <b>${fmtNum(need)} m</b> (${k === '1' ? 'TE + 10 %' : 'TE + 0,90 m'})` : 'Entrez le TE pour voir les mouillages permis.';
          r.querySelectorAll('.mk').forEach(m => { const p = m.dataset.prof === '' ? null : Number(m.dataset.prof), li = m.closest('.li');
            li.classList.toggle('okd', ok && p != null && p >= need); li.classList.toggle('bad', ok && p != null && p < need);
            m.textContent = !ok ? '' : p == null ? ' ?' : p >= need ? ' ✔' : ' ✘'; });
        };
        r.querySelector('#aTe').oninput = upd; r.querySelectorAll('input[name="atk"]').forEach(i => i.onchange = upd); upd();
      }};
  },
  lieu({id}) {
    const l = DB.get('lieux', id); if (!l) return VIEWS.notFound();
    const items = itemsFor({lieuId:id}).sort(sortBrief), u = usage('lieu', id);
    const rows = [{k:'Secteur', v:l.secteur}];
    if (l.cat === 'quai' || l.cat === 'ancrage') rows.push({k:'Profondeur réf.', v:fmtM(l.profondeur)}, {k:'Réf. verticale', v:l.refVert});
    if (l.cat === 'quai') rows.push({k:'Secteur (liste)', v:regionOf(l)}, {k:'Station niveau d\'eau', v:l.station}, {k:'Angle', v:l.angle}, {k:'Hauteur', v:fmtM(l.hauteur)}, {k:'Navette', v:l.navette || (NAVETTE_DEF.tel ? `${NAVETTE_DEF.tel} (Ville-Marie, par défaut)` : 'À importer avec la sauvegarde')});
    if (l.cat === 'quai' && l.procedure) rows.push({k:'Procédure d\'approche / de départ', v:l.procedure, full:true, txt:true});
    if (l.cat === 'ancrage') rows.push({k:'Dimensions', v:l.dimensions}, {k:'Durée (pétr. / autres)', v:l.duree}, {k:'Restrictions', v:l.restrictions, full:true, txt:true}, {k:'Fond / tenue', v:l.fond, full:true, txt:true});
    if (l.cat === 'remorqueur') rows.push({k:'Compagnie', v:l.compagnie}, {k:'Traction', v:l.traction ? l.traction + (/t/i.test(l.traction) ? '' : ' t') : ''});
    rows.push({k:'Vérifié le', v:l.verifie ? fmtDate(l.verifie) : ''});
    if (l.notes) rows.push({k:'Notes', v:l.notes, full:true, txt:true});
    if (l.source) rows.push({k:'Source', v:l.source, full:true, txt:true});
    const anc = l.cat === 'ancrage' ? `
      <div class="readout big accent"><span class="k">Profondeur</span><span class="v">${l.profondeur != null ? fmtNum(l.profondeur) + ' m' : '?'}</span><span class="s">${esc(l.dimensions || '')}${l.duree ? ' · ' + esc(l.duree) : ''}</span></div>
      <p class="reg">📘 <b>DSQ au mouillage : pétrolier 10 % du TE max · autres navires 0,90 m.</b><span class="src">${esc(DSQ_MOU_SRC)} · note automatique</span></p>
      <div class="addrow"><input id="ancTe" type="text" inputmode="decimal" placeholder="TE m" aria-label="Tirant d'eau maximal"><span id="ancRes" class="sub" style="align-self:center">Entrez le TE max pour vérifier.</span></div>` : '';
    return {title:l.nom, action:{label:'Modifier', icon:'edit', fn:() => go('lieuEdit', {id})}, mount: r => {
        mountFilters(r);
        const te = r.querySelector('#ancTe'); if (!te) return;
        te.oninput = () => { const t = parseNum(te.value), out = r.querySelector('#ancRes');
          if (t == null || Number.isNaN(t)) { out.textContent = 'Entrez le TE max pour vérifier.'; return; }
          const pr = l.profondeur, need = [['Pétrolier', profRequise(t, true)], ['Autres', profRequise(t, false)]];
          out.innerHTML = need.map(([n, v]) => `${n} : ${fmtNum(v)} m requis ${pr == null ? '' : pr >= v ? '<span class="ok-t">✔</span>' : '<span class="warn-t">✘ trop peu d\'eau</span>'}`).join('<br>'); };
      }, html:`
      <div class="sub">${esc(CAT[l.cat])}${l.cat !== 'remorqueur' ? ` · ${u.count} affectation${u.count > 1 ? 's' : ''}` : ''}</div>${anc}${l.cat === 'quai' ? `<div class="row">${navetteBtn(l)}</div>` : ''}
      <div class="row"><button class="btn primary" data-go="noteEdit" data-lieu-id="${id}">${ic('plus')} Note</button>${l.cat !== 'remorqueur' ? `<button class="btn" data-go="manEdit" data-lieu-id="${id}">${ic('plus')} Manœuvre</button>` : ''}</div>
      <h2 class="h2">Notes et manœuvres <span class="cnt">${items.length}</span></h2>
      ${items.length > 2 ? filtersHTML() : ''}
      <div class="stack" id="items">${itemsBlock(items, {hideLieu:true}, 'Rien de noté ici pour l\'instant.')}</div>
      <h2 class="h2">Fiche</h2>${specsHTML(rows)}`};
  },
  lieuEdit({id, cat}) {
    const l = id ? DB.get('lieux', id) : {cat: cat || 'quai'};
    if (id && !l) return VIEWS.notFound();
    return {title:id ? 'Modifier la fiche' : 'Nouvelle fiche', action:saveAction, html:formHTML(LIEU_F, l, !!id),

        onSubmit: o => { const s = DB.put('lieux', {...l, ...o, cat:o.cat || 'quai'}); toast('Fiche enregistrée'); go('lieu', {id:s.id}, {replace:true}); },

  /* Notes et manœuvres */

        onDelete: () => { DB.del('notes', id); toast('Note supprimée'); back(); }

  },
  manEdit({id, affId, navireId, lieuId}) {

        onSubmit: o => { DB.put('notes', {...n, ...o}); toast('Manœuvre enregistrée'); back(); },

      })};
  },

  /* Affectations */
  affectations({an = 'cette', tri = 'date', q = ''}) {
    const y = +curYear();
    const nomN = a => a.navireId ? pickLabel('navires', a.navireId) : '';
    const cmpTxt = f => (a, b) => f(a).localeCompare(f(b), 'fr', {sensitivity:'base'}) || byDateDesc(a, b);
    const cmp = {date:byDateDesc, ancien:(a, b) => -byDateDesc(a, b), nom:cmpTxt(nomN), depart:cmpTxt(depNom), dest:cmpTxt(destNom)}[tri] || byDateDesc;
    const list = DB.list('affectations').filter(a => an === 'toutes' || (a.date || '').startsWith(String(an === 'cette' ? y : y - 1))).sort(cmp);
    const chip = (v, l) => `<button class="fchip" data-go="affectations" data-an="${v}" data-tri="${tri}" data-replace="1" aria-pressed="${an === v}">${l}</button>`;
    return {title:'Mes fiches', action:{label:'Nouvelle', icon:'plus', fn:() => go('affEdit')}, html:`
      <div class="filters" role="group" aria-label="Année">${chip('cette', 'Cette année')}${chip('passee', 'L\'an passé')}${chip('toutes', 'Toutes')}</div>
      <div class="toolbar"><input id="q" type="search" value="${esc(q)}" placeholder="Nom du navire" aria-label="Filtrer par navire" autocomplete="off">

  },
  briefing({affId, navireId, departId, destId}) {
    const a = DB.get('affectations', affId);
    if (a) ({navireId, departId, destId} = a);
    const secs = [], seen = new Map();
    const section = (label, kind, ent, items, extra, ctx) => {
      items.forEach(i => seen.set(i.id, i));
      return `<section class="brief"><button class="brief-h" data-go="${kind}" data-id="${ent.id}"><span><span class="lbl">${esc(label)}</span><br><span class="t">${esc(ent.nom)}</span></span><span style="flex:1"></span>${ic('chev')}</button>
        ${extra || ''}<div class="stack">${itemsBlock(items, ctx, 'Rien de noté pour l\'instant.')}</div></section>`;
    };
    const n = DB.get('navires', navireId);
    if (n) {
      const u = usage('navire', n.id);
      const facts = [n.longueur != null && `L ${fmtM(n.longueur)}`, n.largeur != null && `B ${fmtM(n.largeur)}`, n.helice, n.bt && `Prop. AV ${powHP(n.bt)}`, n.st && `Prop. AR ${powHP(n.st)}`, `Piloté ${u.count} fois`].filter(Boolean);
      secs.push(section('Navire', 'navire', n, itemsFor({navireId:n.id}).sort(sortBrief), `<div class="chips">${facts.map(f => `<span class="chip static">${esc(f)}</span>`).join('')}</div>`, {hideNavire:true}));
    }
    const lieuSec = (label, lid) => {
      const l = DB.get('lieux', lid); if (!l) return;
      const facts = [CAT[l.cat], l.profondeur != null && `Prof. réf. ${fmtM(l.profondeur)}`, l.angle && `Angle ${l.angle}`, l.hauteur != null && `Haut. ${fmtM(l.hauteur)}`, l.secteur].filter(Boolean);
      const proc = l.procedure ? `<div class="info"><b>Procédure d'approche / de départ</b><br>${esc(l.procedure).replace(/\n/g, '<br>')}</div>` : '';
      secs.push(section(label, 'lieu', l, itemsFor({lieuId:l.id}).sort(sortBrief), `<div class="chips">${facts.map(f => `<span class="chip static">${esc(f)}</span>`).join('')}</div>${proc}`, {hideLieu:true}));
    };
    lieuSec('Départ', departId);
    if (destId !== departId && !(a && (a.destAutre || a.destMode === 'mer'))) lieuSec('Destination', destId);
    const all = [...seen.values()];

      ${secs.join('') || '<p class="empty">Choisissez un navire et un quai dans l\'affectation pour voir le briefing.</p>'}
      ${a ? `<div class="row"><button class="btn primary" data-go="manEdit" data-aff-id="${a.id}">${ic('plus')} Manœuvre</button><button class="btn" data-go="noteEdit" data-aff-id="${a.id}">${ic('plus')} Note</button></div>` : ''}`};

  /* Réglages et sauvegarde */

      <p class="hint">La sauvegarde contient vos fiches, vos notes perso et le bottin : ne la partagez pas.${PWA ? '' : ' Ici, utilisez « Copier le texte ».'}</p>

        };

          const f = e.target.files[0]; if (!f) return;

          const prev = r.querySelector('#impPrev');

          if (!data || data.schema !== 1 || !Array.isArray(data.navires) || !Array.isArray(data.notes)) { prev.innerHTML = '<p class="empty">Ce texte n\'est pas une sauvegarde Marine Pilot Pro valide.</p>'; return; }
          prev.innerHTML = `<p class="info">Sauvegarde valide : ${data.navires.length} navires, ${(data.lieux || []).length} lieux, ${data.notes.length} notes et manœuvres, ${(data.affectations || []).length} affectations.</p><div><button class="btn primary block" id="btnImp">Remplacer mes données par cette sauvegarde</button></div>`;
          const bi = prev.querySelector('#btnImp');
          bi.onclick = () => confirmInline(bi, 'Vos données actuelles seront remplacées. Une copie de secours est créée avant.', () => {
            const pv = prive && Array.isArray(prive.pilotes) ? prive : DB.d.prive; writeBackup(); DB.d = data; if (pv) DB.d.prive = pv; DB.norm(); DB.save(); hydrate(); applyTheme(); toast('Sauvegarde restaurée'); go('home', {}, {reset:true});

          const b = readBackup(); writeBackup(); DB.d = b.data; DB.norm(); DB.save(); hydrate(); applyTheme(); toast('Copie de secours restaurée'); go('home', {}, {reset:true});
        }, 'Revenir à la copie');
      }};
  }
};

function hydrate() {
  const pv = DB.d.prive; if (INJECTE || !pv) return;
  if (Array.isArray(pv.pilotes)) PILOTES.splice(0, PILOTES.length, ...pv.pilotes);
  if (pv.tels) { if (pv.tels.navette) TELS.navette = String(pv.tels.navette); if (pv.tels.lpa) TELS.lpa = String(pv.tels.lpa); NAVETTE_DEF.tel = TELS.navette || ''; }
}
function readBackup() { try { const b = JSON.parse(localStorage.getItem(BACKUP_KEY)); return b && b.data ? b : null; } catch (e) { return null; } }
function writeBackup() { try { localStorage.setItem(BACKUP_KEY, JSON.stringify({date:nowLocal(), data:DB.d})); } catch (e) {} }
const MQ = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

}
if (MQ) { try { MQ.addEventListener('change', applyTheme); } catch (e) { try { MQ.addListener(applyTheme); } catch (e2) {} } }
function updStatus() {
  const st = currentStretch(), y = curYear();
  $('#cnt').textContent = `${st ? pad(stretchCount(st)) : '00'}-${pad(yearCount(y))}`;
  $('#clock').textContent = hhmm();
  const sc = document.getElementById('shClock'); if (sc) sc.textContent = hhmm();
}
setInterval(() => {
  updStatus();
  if (persoUntil && !persoOk()) { persoUntil = 0; if (stack[stack.length - 1].view === 'perso') go('perso', {}, {replace:true}); }
}, 10000);

/* ---------- Démarrage ---------- */
$('#btnBack').innerHTML = ic('back');
$('#btnBack').onclick = () => (PWA && stack.length > 1) ? history.back() : back();
$('#tabs').onclick = e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  if (b.dataset.s) go('bottin', {s:b.dataset.s}, {replace:true}); else go(b.dataset.tab, {}, {reset:true});
};
$('#title').onclick = e => { if (e.target.closest('#brandBtn')) go('reglages'); };
$('#main').addEventListener('click', e => {
  const ap = e.target.closest('[data-appel]'); if (ap) { openAppel(ap.dataset.appel, ap.dataset.id); return; }
  if (e.target.closest('[data-notel]')) { toast('Numéro absent : restaurez votre sauvegarde dans Réglages.'); return; }
  const sa = e.target.closest('[data-start]'); if (sa) { startAff(sa.dataset.start); return; }
  const fi = e.target.closest('[data-finish]'); if (fi) { finishAff(fi.dataset.finish, fi); return; }
});
$('#main').addEventListener('click', e => {
  const el = e.target.closest('[data-go]'); if (!el) return;
  const {go: v, replace, ...p} = el.dataset;
  go(v, p, {replace: !!replace});
});
DB.load();
hydrate();
applyTheme();
stack.push({view:'home', params:{}});
render();
if (PWA && 'serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {} }
})();
</script>
</body>
</html>
